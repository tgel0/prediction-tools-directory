name: Tool Request
description: Suggest a tool to be added to the directory
title: "[New Tool]: <Tool Name>"
labels: ["tool-request"]
body:
  - type: input
    id: name
    attributes:
      label: Tool Name
    validations:
      required: true
  
  - type: input
    id: url
    attributes:
      label: Website URL
      placeholder: https://...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Platforms
        - Trading Terminals
        - AI Agents & Bots
        - Market Intelligence
        - Analysis Tools
        - Information & OSINT
        - Infrastructure & APIs
    validations:
      required: true

  - type: input
    id: x_url
    attributes:
      label: X Profile URL
      placeholder: https://x.com/...

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A 2-3 sentence description of what the tool does.
    validations:
      required: true

  - type: dropdown
    id: pricing
    attributes:
      label: Pricing Model
      options:
        - Free
        - Freemium
        - Paid
        - Custom

  - type: dropdown
    id: access
    attributes:
      label: Access
      options:
        - Public
        - Waitlist
        - Invite-only

  - type: input
    id: tags
    attributes:
      label: Tags
      placeholder: e.g. Crypto, Data, Trading (comma separated)

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Web, iOS, Android, Telegram, Discord
